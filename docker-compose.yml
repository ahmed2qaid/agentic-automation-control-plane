services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowguard}
      POSTGRES_DB: ${POSTGRES_DB:-flowguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowguard} -d ${POSTGRES_DB:-flowguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-flowguard}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-flowguard}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-development-key}
      N8N_SECURE_COOKIE: "false"
      FLOWGUARD_SHARED_SECRET: ${N8N_SHARED_SECRET:-change-me-in-production}
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://flowguard:flowguard@postgres:5432/flowguard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-change-me-in-production}
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      MAX_AUTO_COST_USD: ${MAX_AUTO_COST_USD:-0.50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  n8n_data:
